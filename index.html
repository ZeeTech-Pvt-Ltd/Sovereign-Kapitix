<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline "SK" hexagon favicon - the browser-tab icon. Kept as a data URI
         so it costs no request. Mirrors public/favicon.svg and .logo-hex in
         src/index.css; all three must stay in step. `#` is written as %23
         inside a data URI. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230F766E'/><stop offset='0.55' stop-color='%230B5D57'/><stop offset='1' stop-color='%2305332F'/></linearGradient></defs><polygon points='50,1 92.4,25.5 92.4,74.5 50,99 7.6,74.5 7.6,25.5' fill='url(%23g)'/><text x='50' y='64' font-family='Arial' font-weight='800' font-size='40' letter-spacing='-1.5' fill='white' text-anchor='middle'>SK</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Marks the document as JS-enabled so .reveal content hides only when a
         script will actually reveal it; without JS everything stays visible
         (prerendered HTML included). -->
    <script>document.documentElement.classList.add('js')</script>

    <!-- Third-party connection warm-up. -->
    <link rel="preconnect" href="https://flagcdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://flagcdn.com" />

    <!-- Search Console ownership verification. -->
    <meta name="google-site-verification" content="Cx0lmBQmPq_TuNTl0fhsHbfNI9Nom-HGNk82dbMySRw" />

    <!-- Google tag (gtag.js). Feeds GA4 property G-2K32GJQKWT.
         THESE TAGS MUST STAY ABOVE THE "Primary metadata" MARKER BELOW.
         scripts/build.mjs replaces everything from that marker down, per route,
         so a tag placed under it is present on the dev server and in no
         prerendered page that ships. Above the marker, every route gets it.
         gtag.js sets its own cookies and sends page views, so the Privacy
         Policy describes it (section 09) and has to keep doing so. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2K32GJQKWT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-2K32GJQKWT');
    </script>

    <!-- Primary metadata (homepage defaults; <Seo/> updates per route).
         scripts/build.mjs REPLACES everything from here down per route, so in
         production these values never ship - they exist for the dev server,
         where index.html is served as-is. Keep them in step with seo.home in
         src/data/seo.js or dev and production disagree. -->
    <title>Sovereign Kapitix | AI Trading Platform for Australia</title>
    <meta name="description" content="Sovereign Kapitix - AI-powered automated trading platform for Australia. 24/7 automated strategies, live signals, bank-grade security." />
    <meta name="keywords" content="automated trading platform australia, AI trading platform, automated crypto trading, Sovereign Kapitix, AI trading Australia" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://sovereign-kapitix.net/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Sovereign Kapitix" />
    <meta property="og:title" content="Sovereign Kapitix | AI Trading Platform for Australia" />
    <meta property="og:description" content="Sovereign Kapitix - AI-powered automated trading platform for Australia. 24/7 automated strategies, live signals, bank-grade security." />
    <meta property="og:url" content="https://sovereign-kapitix.net/" />
    <meta property="og:image" content="https://sovereign-kapitix.net/og-image.png" />
    <meta property="og:image:alt" content="Sovereign Kapitix - AI-powered automated trading platform for Australia" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_AU" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sovereign Kapitix | AI Trading Platform for Australia" />
    <meta name="twitter:description" content="Sovereign Kapitix - AI-powered automated trading platform for Australia. 24/7 automated strategies, live signals, bank-grade security." />
    <meta name="twitter:image" content="https://sovereign-kapitix.net/og-image.png" />
  </head>
