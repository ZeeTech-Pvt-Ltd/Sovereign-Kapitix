<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E" />
      <stop offset="0.55" stop-color="#0B5D57" />
      <stop offset="1" stop-color="#05332F" />
    </linearGradient>
  </defs>
  <!-- Pointy-top hexagon: vertices at 90/30/-30/-90/-150/150 degrees.
       Mirrors .logo-hex in src/index.css. -->
  <polygon points="50,1 92.4,25.5 92.4,74.5 50,99 7.6,74.5 7.6,25.5" fill="url(#sk)" />
  <!-- y=64 is a manual baseline so the cap-height sits optically centred; some
       rasterisers ignore dominant-baseline, this does not rely on it. -->
  <text x="50" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="800" font-size="40" letter-spacing="-1.5" fill="#ffffff">SK</text>
</svg>
